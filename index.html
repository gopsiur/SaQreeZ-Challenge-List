<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SDL - SaQreeZ Demon List | Geometry Dash Challenge List</title>
        <meta name="description" content="SaQreeZ Demon List (SDL) - The official community ranking list, leaderboard, level packs, and roulette for Geometry Dash challenge levels." />

        <link rel="icon" href="/SDL_logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/packs.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/animations.css" />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script src="js/scroll-animations.js"></script>
        <script src="js/ripple-effect.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <header>
            <router-link to="/" class="logo">
                <span class="logo-badge">SDL</span>
                <div class="logo-text">
                    <h2>SaQreeZ Demon List</h2>
                    <p>Geometry Dash Challenge List</p>
                </div>
            </router-link>
            <nav class="nav">
                <div class="nav-links">
                    <router-link class="nav__tab" to="/">
                        <span>List</span>
                    </router-link>
                    <router-link class="nav__tab" to="/leaderboard">
                        <span>Leaderboard</span>
                    </router-link>
                    <router-link class="nav__tab" to="/roulette">
                        <span>Roulette</span>
                    </router-link>
                    <router-link class="nav__tab" to="/packs">
                        <span>Packs</span>
                    </router-link>
                </div>
                <div class="nav__actions">
                    <button
                        class="nav__icon"
                        @click.stop="store.toggleDark()"
                        type="button"
                        title="Przełącz motyw"
                    >
                        <img
                            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                            alt="Toggle Theme"
                        />
                    </button>
                    <a class="nav__icon" href="https://discord.gg/nqCAccHWJu" target="_blank" title="Discord">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <a
                        class="nav__cta"
                        href="https://discord.gg/nqCAccHWJu"
                        target="_blank"
                    >
                        <span>Discord Server</span>
                    </a>
                </div>
            </nav>
        </header>
        <router-view></router-view>
    </body>
</html>
